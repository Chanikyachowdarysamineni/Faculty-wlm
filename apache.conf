# Apache Configuration for Faculty WLM Production
# Deploy to /var/www/html/csefaculty/
# Place this in sites-available and enable with: a2ensite csefaculty

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName 160.187.169.41
    ServerAdmin admin@vignan.ac.in
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS VirtualHost
<VirtualHost *:443>
    ServerName 160.187.169.41
    ServerAdmin admin@vignan.ac.in
    
    # SSL Certificate Configuration
    # Replace with your certificate paths (e.g., from Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/your-domain.crt
    SSLCertificateKeyFile /etc/ssl/private/your-domain.key
    # Uncomment if you have a chain certificate
    # SSLCertificateChainFile /etc/ssl/certs/your-domain.ca-bundle
    
    # SSL Configuration (Modern)
    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder On
    
    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    
    # Document root
    DocumentRoot /var/www/html
    
    # ──────────────────────────────────────────────────────────
    # Mod Rewrite - Enable for SPA routing
    # ──────────────────────────────────────────────────────────
    
    <Directory /var/www/html/csefaculty>
        Options -MultiViews
        RewriteEngine On
        
        # SPA Routing: if not a real file or directory, serve index.html
        RewriteCond %{REQUEST_FILENAME} -d [OR]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [QSA,L]
        RewriteRule ^ index.html [QSA,L]
        
        # Allow all access
        AllowOverride All
        Require all granted
    </Directory>

    # ──────────────────────────────────────────────────────────
    # Root redirect
    # ──────────────────────────────────────────────────────────
    
    <Directory /var/www/html>
        RewriteEngine On
        RewriteRule ^/?$ /csefaculty/ [R=301,L]
    </Directory>

    # ──────────────────────────────────────────────────────────
    # Cache headers for static assets
    # ──────────────────────────────────────────────────────────
    
    <FilesMatch "^.*\.js\.map$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>
    
    <FilesMatch "^.*\.js$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    <FilesMatch "^.*\.css$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    <FilesMatch "^.*\.(png|jpg|jpeg|gif|svg|webp)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    
    <FilesMatch "^index\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    # ──────────────────────────────────────────────────────────
    # MIME types
    # ──────────────────────────────────────────────────────────
    
    <FilesMatch "\.js$">
        AddType application/javascript
    </FilesMatch>
    
    <FilesMatch "\.webp$">
        AddType image/webp
    </FilesMatch>
    
    <FilesMatch "\.woff$">
        AddType font/woff
    </FilesMatch>
    
    <FilesMatch "\.woff2$">
        AddType font/woff2
    </FilesMatch>

    # ──────────────────────────────────────────────────────────
    # Proxy to Backend API (/deva)
    # ──────────────────────────────────────────────────────────
    
    <Location /deva>
        ProxyPreserveHost On
        ProxyPass https://localhost:5000/deva
        ProxyPassReverse https://localhost:5000/deva
        ProxyTimeout 3600
        
        # Headers
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    </Location>

    <Location /csefaculty/deva>
        ProxyPreserveHost On
        ProxyPass https://localhost:5000/deva
        ProxyPassReverse https://localhost:5000/deva timeout=3600
        
        # Rewrite module already handles path
        ProxyPassReverse / /csefaculty/deva/
        
        # Headers
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    </Location>

    # ──────────────────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────────────────
    
    ErrorLog ${APACHE_LOG_DIR}/csefaculty_error.log
    CustomLog ${APACHE_LOG_DIR}/csefaculty_access.log combined
</VirtualHost>

# Enable Apache modules needed:
# sudo a2enmod rewrite
# sudo a2enmod proxy
# sudo a2enmod proxy_http
# sudo a2enmod ssl
# sudo a2enmod headers
